<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#1A2620; --muted:#5E6B63; --line:#D5DCD6;
  --mala:#0E5A43; --mala-soft:#DCEBE4; --copper:#B5652B; --copper-soft:#F4E4D7; --loss:#B3261E;
  --hero-ink:#FFFFFF; --field:#F6F8F5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101814; --surface:#18231D; --ink:#E7EEE9; --muted:#93A39A; --line:#2A3730;
    --mala:#2E8F6C; --mala-soft:#1E3A2F; --copper:#E08A4C; --copper-soft:#3A2A1E; --loss:#FF8A80;
    --hero-ink:#FFFFFF; --field:#1F2B24;
  }
}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#18231D; --ink:#E7EEE9; --muted:#93A39A; --line:#2A3730;
  --mala:#2E8F6C; --mala-soft:#1E3A2F; --copper:#E08A4C; --copper-soft:#3A2A1E; --loss:#FF8A80;
  --hero-ink:#FFFFFF; --field:#1F2B24;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.4}
.num,.big,input.n{font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--copper); outline-offset:2px}

.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg);
  border-bottom:1px solid var(--line); padding:10px 14px}
.top-row{display:flex; align-items:center; gap:8px; max-width:640px; margin:0 auto}
.shop{font-family:"Barlow Semi Condensed",sans-serif; font-weight:700; font-size:1.05rem; color:var(--mala); flex:1}
.status{font-size:.8rem; color:var(--muted)}
.daynav{display:flex; align-items:center; gap:6px; max-width:640px; margin:8px auto 0}
.daynav .arrow{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:1.2rem}
.daynav .arrow:disabled{opacity:.35; cursor:default}
.daylabel{flex:1; text-align:center; font-weight:600; text-transform:capitalize}

main{max-width:640px; margin:0 auto; padding:14px 14px 110px}

.hero{background:var(--mala); color:var(--hero-ink); border-radius:18px; padding:18px 18px 16px; margin-bottom:16px}
.hero .lbl{font-size:.9rem; opacity:.85}
.hero .big{font-size:2.6rem; font-weight:700; line-height:1.05; margin:2px 0 2px}
.hero .usd{font-size:1.05rem; opacity:.9}
.hero.loss .big{color:#FFD5CF}
.hero-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.22)}
.hero-grid div{font-size:.85rem; opacity:.85}
.hero-grid b{display:block; font-family:"Barlow Semi Condensed",sans-serif; font-size:1.15rem; font-weight:600; opacity:1}

section.block{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden}
.block-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:12px 14px 8px}
.block-head h2{margin:0; font-family:"Barlow Semi Condensed",sans-serif; font-size:1.15rem; font-weight:700}
.block-head .num{font-weight:600; font-size:1.1rem; color:var(--mala)}
.hint{padding:0 14px 8px; font-size:.82rem; color:var(--muted)}

.row{display:grid; gap:8px; padding:10px 14px; border-top:1px solid var(--line); align-items:end}
.row.mm{grid-template-columns:1fr 1fr}
.row.un{grid-template-columns:1fr 1fr}
.row .name{grid-column:1/-1; display:flex; align-items:center; gap:8px}
.row .name input{flex:1; border:none; background:transparent; font-weight:600; font-size:1rem; padding:2px 0; color:var(--ink); min-width:0}
.row .name input:focus{border-bottom:1px solid var(--copper); outline:none}
.row .del{border:none; background:none; color:var(--muted); font-size:1.1rem; width:32px; height:32px; border-radius:8px}
.row .out{grid-column:1/-1; display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted)}
.row .out .num{color:var(--ink); font-weight:600; font-size:1rem}
label.f{display:flex; flex-direction:column; gap:3px; font-size:.78rem; color:var(--muted)}
input.n,input.t{width:100%; border:1px solid var(--line); background:var(--field); color:var(--ink);
  border-radius:10px; padding:10px 10px; font-size:1.1rem; min-width:0}
input.t{font-family:inherit; font-size:1rem}
.add{display:block; width:100%; border:none; border-top:1px dashed var(--line); background:none; color:var(--copper);
  font-weight:600; padding:12px 14px; text-align:left}

.cmp{display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:12px 14px; border-top:1px solid var(--line); font-size:.95rem}
.cmp .num{text-align:right; font-weight:600}
.cmp .strong{font-weight:700}
.pos{color:var(--mala)} .neg{color:var(--loss)}
.auto{font-size:.75rem; color:var(--copper); margin-left:4px}

.tabs{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; max-width:640px; margin:0 auto; padding:6px max(6px, env(safe-area-inset-right,0px)) 6px max(6px, env(safe-area-inset-left,0px))}
.tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; border:1px solid var(--line); background:var(--field); border-radius:12px; padding:7px 2px 6px; font-weight:600; color:var(--muted); font-size:.68rem; letter-spacing:-.01em; min-width:0; line-height:1.1}
.tabs button svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.tabs button span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tabs button[aria-current="page"]{color:#fff; background:var(--mala); border-color:var(--mala)}

.primary{display:block; width:100%; border:none; border-radius:12px; background:var(--copper); color:#fff; font-weight:700;
  padding:14px; font-size:1.02rem; margin:0 0 14px}
.ghost{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 14px; font-weight:600}
.danger{color:var(--loss)}

.hist{list-style:none; margin:0; padding:0}
.hist li{border-top:1px solid var(--line)}
.hist li:first-child{border-top:none}
.hist button{width:100%; display:grid; grid-template-columns:1fr auto; gap:2px 12px; text-align:left; border:none; background:none; padding:12px 14px}
.hist .d{font-weight:600; text-transform:capitalize}

(function(){
"use strict";
// ---------- Données par défaut ----------
const DEF_TAUX = 2300;
const DEF_ACHAT = 2280;   // taux auquel on achète les dollars aux clients
const DEF_OBJ = 1000;     // objectif : dollars achetés par jour
const DEF_MM = ["Airtel Money","Orange Money","M-Pesa"];
// Supprime les doubles « Airtel Money (2) » et « Orange Money (2) » des journées déjà enregistrées.
// Si un double contenait des montants, ils sont ajoutés à la ligne principale pour ne rien perdre.
function nettoyerDoubles(){
  const changes = [];
  for(const k of Object.keys(days)){
    const d = days[k]; if(!d || !Array.isArray(d.mm)) continue;
    let modif = false;
    for(const base of ["Airtel Money","Orange Money"]){
      const iDbl = d.mm.findIndex(r=> r && String(r.label).trim()===base+" (2)");
      if(iDbl<0) continue;
      const dbl = d.mm[iDbl];
      const main = d.mm.find(r=> r && String(r.label).trim()===base);
      if(main){
        main.fc = n(main.fc) + n(dbl.fc);
        main.usd = n(main.usd) + n(dbl.usd);
        d.mm.splice(iDbl,1);
      } else {
        dbl.label = base;
      }
      modif = true;
    }
    if(Array.isArray(d.un)){
      for(const base of ["Unités Airtel","Unités Orange"]){
        const iDbl = d.un.findIndex(r=> r && String(r.label).trim()===base+" (2)");
        if(iDbl<0) continue;
        const dbl = d.un[iDbl];
        const main = d.un.find(r=> r && String(r.label).trim()===base);
        if(main){ main.qte = n(main.qte) + n(dbl.qte); d.un.splice(iDbl,1); }
        else dbl.label = base;
        modif = true;
      }
      if(!d.africellAjoute){
        if(!d.un.some(r=> r && /africell/i.test(String(r.label)))) d.un.push({label:"Unités Africell", qte:0, prix:28.4});
        d.africellAjoute = true; modif = true;
      }
    }
    if(modif) changes.push(k);
  }
  return changes;
}

// ---------- Calculs ----------
const n = v => { const x = typeof v==="number" ? v : parseFloat(String(v||"").replace(/\s/g,"").replace(",", ".")); return isFinite(x)?x:0; };
const fmt = (v,dec=0) => (Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)).toLocaleString("fr-FR",{minimumFractionDigits:0, maximumFractionDigits:dec}).replace(/\u202f|\u00a0/g," ");
const fc = v => fmt(v) + " FC";
const usd = v => fmt(v,2) + " $";
const sortedDates = () => Object.keys(days).sort();
function prevDate(date){ const a = sortedDates().filter(d=>d<date); return a.length ? a[a.length-1] : null; }

function chg(d){
  if(!d.change) d.change = {tauxAchat:DEF_ACHAT, objectif:DEF_OBJ, achats:[], ventes:[]};
  const c = d.change; if(!Array.isArray(c.achats)) c.achats=[]; if(!Array.isArray(c.ventes)) c.ventes=[];
  return c;
}
// Calculs de la page Change pour une journée
function calcChange(d){
  const c = chg(d);
  const tR = n(d.taux)||DEF_TAUX;            // taux de revente = taux du dollar de la journée
  const tA = n(c.tauxAchat)||DEF_ACHAT;      // taux d'achat aux clients
  const obj = n(c.objectif)||DEF_OBJ;
  const ach = c.achats.map(r=>{ const u=n(r.usd), t=n(r.taux)||tA; return {u, t, fcDonne:u*t, benef:u*(tR-t)}; });
  const ven = c.ventes.map(r=>{ const u=n(r.usd), t=n(r.taux)||tR; return {u, t, fcRecu:u*t, ecart:u*(t-tR)}; });
  const usdAch = ach.reduce((a,r)=>a+r.u,0), usdVen = ven.reduce((a,r)=>a+r.u,0);
  const fcDonne = ach.reduce((a,r)=>a+r.fcDonne,0), fcRecu = ven.reduce((a,r)=>a+r.fcRecu,0);
  const benefAch = ach.reduce((a,r)=>a+r.benef,0), ecartVen = ven.reduce((a,r)=>a+r.ecart,0);
  return {tR, tA, obj, ach, ven, usdAch, usdVen, fcDonne, fcRecu, benefAch, ecartVen, benef: benefAch+ecartVen,
          objBenef: obj*(tR-tA), pct: Math.min(100, obj ? usdAch/obj*100 : 0)};
}
// Dollars accumulés (achetés moins vendus) depuis le début, jusqu'à la date donnée
function stockDollars(jusqua){
  let s=0; for(const k of sortedDates()){ if(k>jusqua) break; const x=calcChange(days[k]); s += x.usdAch - x.usdVen; } return s;
}

function estVide(d){
  return d.mm.every(r=>!n(r.fc)&&!n(r.usd)) && d.un.every(r=>!n(r.qte)) && !n(d.esp.fc) && !n(d.esp.usd) && !n(d.esp.commission);
}
// page précédente déjà remplie (on saute les pages encore vides)
function prevRemplie(k){ let p=prevDate(k); while(p && estVide(days[p])) p=prevDate(p); return p; }
function calc(d){
  const t = n(d.taux)||DEF_TAUX;
  const mmRows = d.mm.map(r=> n(r.fc) + n(r.usd)*t);
  const unRows = d.un.map(r=> n(r.qte)*n(r.prix));
  const mm = mmRows.reduce((a,b)=>a+b,0);
  const un = unRows.reduce((a,b)=>a+b,0);
  const espBase = n(d.esp.fc) + n(d.esp.usd)*t;
  const esp = espBase + n(d.esp.commission);
  const dettes = d.dettes.reduce((a,r)=>a+n(r.montant),0);
  if(!Array.isArray(d.creanciers)) d.creanciers = [];
  const cred = d.creanciers.reduce((a,r)=>a+n(r.montant)+n(r.usd)*t,0);
  const dep = d.depenses.reduce((a,r)=>a+n(r.montant),0);
  const total = mm + un + esp + dettes - cred;
  const p = prevRemplie(d.date);
  const autoHier = p ? calc(days[p]).total : null;
  const hierManuel = d.soldeHier!==null && d.soldeHier!==undefined && d.soldeHier!=="";
  const hier = hierManuel ? n(d.soldeHier) : (autoHier||0);
  const vide = estVide(d);
  const gain = vide ? 0 : total - hier;
  return {t, mmRows, unRows, mm, un, espBase, esp, dettes, cred, dep, total, hier, hierManuel, autoHier, vide, gain, gainAvant: vide ? 0 : gain + dep};
}

const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Sépare les milliers : "1000000" devient "1 000 000". Les calculs lisent toujours le bon nombre.
const grp = raw => {
  let s=String(raw==null?"":raw); const neg=/^\s*-/.test(s);
  s=s.replace(/[^0-9.,]/g,"");
  const m=s.search(/[.,]/);
  let ent = m<0 ? s : s.slice(0,m);
  const dec = m<0 ? "" : s[m] + s.slice(m+1).replace(/[.,]/g,"");
  ent = ent.replace(/^0+(?=\d)/,"").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (neg?"-":"") + ent + dec;
};
const iv = v => (v===0||v==="0"||v==null) ? "" : esc(grp(typeof v==="number" ? String(v).replace(".",",") : v));
document.addEventListener("input", e=>{

function shortDate(s){ const [y,m,d]=dayOf(s).split("-").map(Number); const t=new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"short", day:"numeric", month:"short"}); return hourOf(s) ? t+" "+hourOf(s) : t; }

  {id:"autre", nom:"Autres", mots:[]}

const catNom = id => (CATS.find(c=>c.id===id)||CATS[CATS.length-1]).nom;
const sansAccent = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function devineCat(motif){
  const m = " "+sansAccent(motif).replace(/[^a-z0-9']+/g," ")+" ";
  const mots = m.trim().split(" ");
  for(const c of CATS){
    if(c.mots.some(w=>{ const k=sansAccent(w).trim(); return k.includes(" ") ? m.includes(" "+k) : mots.some(x=>x.startsWith(k)); })) return c.id;
  }

// Catégorie d'une dépense : celle choisie, sinon devinée d'après le motif
const catDe = r => (r && r.cat && CATS.some(c=>c.id===r.cat)) ? r.cat : devineCat(r && r.motif);
const optCats = (sel, auto) => (auto ? `<option value="">Automatique</option>` : "") + CATS.map(c=>`<option value="${c.id}" ${sel===c.id?"selected":""}>${esc(c.nom)}</option>`).join("");

// Période choisie pour le bilan des dépenses de l'Historique
let depPer = "mois";
function bornesPeriode(p){
  const x=new Date(), y=x.getFullYear(), m=x.getMonth();
  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(p==="mois")   return {de: iso(new Date(y,m,1)),   a: today(), nom:"ce mois-ci"};
  if(p==="passe")  return {de: iso(new Date(y,m-1,1)), a: iso(new Date(y,m,0)), nom:"le mois passé"};
  if(p==="30")     return {de: iso(new Date(y,m,x.getDate()-29)), a: today(), nom:"les 30 derniers jours"};
  return {de:"0000-00-00", a:"9999-12-31", nom:"depuis le début"};
}
function bilanDepenses(p){
  const B = bornesPeriode(p), parCat = {}, joursAvecDep = new Set();
  CATS.forEach(c=> parCat[c.id] = {tot:0, nb:0, motifs:{}});
  let tot = 0;
  for(const k of sortedDates()){
    const j = dayOf(k); if(j<B.de || j>B.a) continue;
    for(const r of (days[k].depenses||[])){
      const v=n(r.montant); if(!v) continue;
      const c=parCat[catDe(r)], mk=String(r.motif||"Dépense").trim()||"Dépense", cle=sansAccent(mk);
      c.tot+=v; c.nb++; tot+=v; joursAvecDep.add(j);
      if(!c.motifs[cle]) c.motifs[cle]={nom:mk, tot:0, nb:0};
      c.motifs[cle].tot+=v; c.motifs[cle].nb++;
    }
  }
  const liste = CATS.map(c=>Object.assign({id:c.id, nom:c.nom}, parCat[c.id])).filter(c=>c.tot>0).sort((a,b)=>b.tot-a.tot);
  return {B, tot, liste, nbJours: joursAvecDep.size};
}
function blocDepenses(){

    ${R.tot ? `<div class="hint">${esc(R.B.nom.charAt(0).toUpperCase()+R.B.nom.slice(1))} : ${fc(R.tot)} (${usd(R.tot/t)}) sur ${R.nbJours} jour${R.nbJours>1?"s":""} avec dépenses, soit environ ${fc(R.tot/Math.max(1,R.nbJours))} par jour. La plus grosse catégorie : <b>${esc(grosse.nom)}</b>.</div>${lignes}`
      : `<div class="hint">Aucune dépense notée ${esc(R.B.nom)}.</div>`}

// Fuite = argent qui manque sans être expliqué par les dépenses (gain avant dépenses négatif)
function fuiteDe(c){ return c.gainAvant < 0 ? -c.gainAvant : 0; }
// ---------- Enquête sur les fuites : où chercher, ce qui sort de l'habitude ----------
// Compare chaque ligne de la page avec la page remplie précédente, et avec l'habitude des 30 dernières pages.
const PST_MIN = 2000; // en dessous, un écart n'est pas signalé
const lkey = s => String(s||"").trim().toLowerCase();
const med = a => { if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y), m=b.length>>1; return b.length%2 ? b[m] : (b[m-1]+b[m])/2; };
// Photo d'une page, ligne par ligne, en unités d'origine (francs, dollars, unités)
function photo(d){
  const t=n(d.taux)||DEF_TAUX, L={};
  const put=(k,nom,fc,usd,extra)=>{ L[k]=Object.assign({nom, fc:n(fc), usd:n(usd)}, extra||{}); };
  (d.mm||[]).forEach(r=> put("mm:"+lkey(r.label), r.label||"Monnaie électronique", r.fc, r.usd));
  (d.un||[]).forEach(r=> put("un:"+lkey(r.label), r.label||"Unités", n(r.qte)*n(r.prix), 0, {qte:n(r.qte), prix:n(r.prix)}));
  const e=d.esp||{};
  put("esp:fc","Espèces en francs", e.fc, 0); put("esp:usd","Espèces en dollars", 0, e.usd); put("esp:com","Commission", e.commission, 0);
  put("dettes","Dettes des clients", (d.dettes||[]).reduce((a,r)=>a+n(r.montant),0), 0);
  put("cred","Créanciers (ce que le shop doit)", -(d.creanciers||[]).reduce((a,r)=>a+n(r.montant),0), -(d.creanciers||[]).reduce((a,r)=>a+n(r.usd),0));
  return {t, L};
}
const valeur = (x,t) => x ? x.fc + x.usd*t : 0;
// Écart d'une ligne entre deux pages, au taux de la page récente (l'effet du taux est compté à part)
function ecarts(dPrev, dCur){
  const a=photo(dPrev), b=photo(dCur), out={};
  for(const k of new Set([...Object.keys(a.L), ...Object.keys(b.L)])){
    const p=a.L[k], c=b.L[k];
    let dl = (c?c.fc:0)-(p?p.fc:0) + ((c?c.usd:0)-(p?p.usd:0))*b.t;
    let prixEff = 0;
    if(k.startsWith("un:") && p && c && p.prix && c.prix!==p.prix){ prixEff = p.qte*(c.prix-p.prix); dl -= prixEff; }
    out[k] = {nom:(c||p).nom, dl, prixEff, avant:valeur(p,a.t), apres:valeur(c,b.t), p, c};
  }
  const usdPrev = Object.values(a.L).reduce((s,x)=>s+x.usd,0);
  return {L:out, effetTaux: usdPrev*(b.t-a.t), tPrev:a.t, tCur:b.t, usdPrev};
}
// Habitude de chaque ligne : écarts des pages passées (jusqu'à 30 paires de pages remplies)
function habitudes(jusqua){
  const pages = sortedDates().filter(k=> k<jusqua && !estVide(days[k])).slice(-31);
  const H={}, deps=[];
  for(let i=1;i<pages.length;i++){
    const e=ecarts(days[pages[i-1]], days[pages[i]]);
    for(const k in e.L){ (H[k]=H[k]||[]).push(e.L[k].dl); }
    deps.push((days[pages[i]].depenses||[]).reduce((a,r)=>a+n(r.montant),0));
  }
  const S={};
  for(const k in H){ const a=H[k], m=med(a), mad=med(a.map(x=>Math.abs(x-m))); S[k]={n:a.length, m, ecart:Math.max(mad*1.4826, PST_MIN)}; }
  return {S, deps, nbPages:pages.length};
}
const proche = (a,b,tol) => b>0 && Math.abs(a-b) <= b*tol;
// Liste des pistes, de la plus probable à la moins probable
function enquete(k){
  const d=days[k], c=calc(d), F=fuiteDe(c), prevK=prevRemplie(k);
  if(!prevK || c.vide) return {F, pistes:[], alertes:[]};
  const e=ecarts(days[prevK], d), h=habitudes(k), pistes=[], alertes=[];
  const add=(score, titre, texte, montant, sorte)=>{ if(score>0) pistes.push({score, titre, texte, montant, sorte:sorte||"ligne"}); };
  const cible = Math.max(F, 1);
  for(const key in e.L){
    const x=e.L[key], s=h.S[key];
    if(key==="cred") continue;
    // une ligne remplie avant, vide aujourd'hui : souvent un oubli de saisie
    if(x.avant>=PST_MIN && Math.abs(x.apres)<1){
      add(proche(x.avant,F,.25)?1:.6, x.nom+" : case vide", "Elle valait "+fc(x.avant)+" à la page précédente et vaut 0 maintenant. Montant oublié, ou argent sorti ?", x.avant, "oubli");
      continue;
    }
    // un zéro en trop ou en moins
    if(x.avant>=PST_MIN*5 && x.apres>0 && (proche(x.apres*10,x.avant,.06) || proche(x.apres/10,x.avant,.06))){
      add(.9, x.nom+" : un zéro de trop ou de moins ?", "On passe de "+fc(x.avant)+" à "+fc(x.apres)+". Vérifiez le nombre de zéros tapés.", Math.abs(x.avant-x.apres), "frappe");
      continue;
    }
    // baisse plus forte que d'habitude
    const attendu = s && s.n>=3 ? s.m : 0, bizarre = x.dl - attendu;
    if(bizarre < -PST_MIN){
      const anormal = s && s.n>=3 ? (-bizarre > 2.5*s.ecart) : true;
      let sc = Math.min(-bizarre, cible)/cible * (anormal?1:.55);
      if(F>0 && proche(-x.dl, F, .03)) sc = Math.max(sc, .95);
      if(F<=0) sc *= .5;
      add(sc, x.nom+" : baisse "+(anormal?"inhabituelle":"à vérifier"),
        (s && s.n>=3 ? "D'habitude, cette ligne change d'environ "+(s.m>0?"+":"")+fc(s.m)+" d'une page à l'autre. Cette fois : "+(x.dl>0?"+":"")+fc(x.dl)+"."
                     : "Elle a baissé de "+fc(-x.dl)+" depuis la page précédente.")
        + (F>0 && proche(-x.dl,F,.03) ? " C'est presque exactement le montant qui manque." : ""), -bizarre);
    }
    if(x.prixEff < -PST_MIN) add(.5, x.nom+" : le prix de l'unité a changé", "Le prix est passé de "+fmt(x.p.prix,2)+" à "+fmt(x.c.prix,2)+" FC. Le stock vaut "+fc(-x.prixEff)+" de moins sur le papier, sans argent perdu.", -x.prixEff, "explication");
  }
  // dettes des clients effacées sans que l'argent arrive ailleurs
  const dt=e.L["dettes"];
  if(dt && dt.dl < -PST_MIN){
    const autres = Object.keys(e.L).filter(q=>q!=="dettes"&&q!=="cred").reduce((a,q)=>a+e.L[q].dl,0);
    if(autres < -dt.dl*.5) add(Math.min(-dt.dl,cible)/cible*.9, "Dettes des clients : "+fc(-dt.dl)+" en moins", "Une dette a été retirée, mais l'argent n'apparaît dans aucun compte. Le client a-t-il vraiment payé ?", -dt.dl);
  }
  const cr=e.L["cred"];
  if(cr && cr.dl < -PST_MIN) add(.45, "Nouvelle dette du shop", "Le shop doit "+fc(-cr.dl)+" de plus aux créanciers. Normal si c'est voulu, sinon vérifiez.", -cr.dl, "explication");
  // baisse du taux : les dollars valent moins, sans vol
  if(e.effetTaux < -PST_MIN) add(Math.min(-e.effetTaux,cible)/cible*.8, "Le taux du dollar a baissé", "De "+fmt(e.tPrev)+" à "+fmt(e.tCur)+" FC. Vos "+fmt(e.usdPrev,2)+" $ valent "+fc(-e.effetTaux)+" de moins en francs. Ce n'est pas de l'argent perdu.", -e.effetTaux, "explication");
  // dollars achetés aux clients qu'on ne retrouve pas dans la caisse en dollars
  const ch=calcChange(d), att=ch.usdAch-ch.usdVen, ed=e.L["esp:usd"];
  if(att>=5 && ed){
    const recu = (ed.c?ed.c.usd:0)-(ed.p?ed.p.usd:0), manque = att-recu;
    if(manque>=5) add(Math.min(manque*e.tCur,cible)/cible*.85, "Dollars du change introuvables", "La page Change compte "+fmt(att,2)+" $ achetés en plus, mais la caisse en dollars n'a augmenté que de "+fmt(recu,2)+" $. Il manque "+fmt(manque,2)+" $.", manque*e.tCur);
  }
  // dépenses oubliées / dépenses trop fortes
  const depH = med(h.deps.filter(v=>v>0)), joursDep = h.deps.filter(v=>v>0).length;
  if(F>0 && c.dep===0 && joursDep>=Math.max(3,h.deps.length*.6)) add(proche(depH,F,.35)?.7:.35, "Aucune dépense notée", "D'habitude vous notez environ "+fc(depH)+" de dépenses. Une dépense a peut-être été oubliée.", depH, "oubli");
  if(c.dep>0 && depH>0 && c.dep > Math.max(3*depH, depH+20000)) alertes.push({titre:"Dépenses plus fortes que d'habitude", texte:fc(c.dep)+" aujourd'hui, contre environ "+fc(depH)+" d'habitude."});
  // lignes en forte hausse inhabituelle (excès)
  for(const key in e.L){ const x=e.L[key], s=h.S[key]; if(key==="cred"||!s||s.n<5) continue;
    if(x.dl - s.m > Math.max(4*s.ecart, 50000)) alertes.push({titre:x.nom+" : hausse inhabituelle", texte:"+"+fc(x.dl)+" alors que d'habitude c'est environ "+(s.m>0?"+":"")+fc(s.m)+". Un montant tapé en trop ?"}); }
  pistes.sort((a,b)=>b.score-a.score);
  return {F, pistes:pistes.slice(0,5), alertes:alertes.slice(0,3)};
}
// Fuite de chaque page, calculée en un seul passage (rapide même avec beaucoup de journées)
function fuitesToutes(){
  const R={}; let prevTot=null;
  for(const k of sortedDates()){
    const d=days[k]; if(estVide(d)) continue;
    const t=n(d.taux)||DEF_TAUX, e=d.esp||{};
    const tot = (d.mm||[]).reduce((a,r)=>a+n(r.fc)+n(r.usd)*t,0) + (d.un||[]).reduce((a,r)=>a+n(r.qte)*n(r.prix),0)
      + n(e.fc)+n(e.usd)*t+n(e.commission) + (d.dettes||[]).reduce((a,r)=>a+n(r.montant),0) - (d.creanciers||[]).reduce((a,r)=>a+n(r.montant)+n(r.usd)*t,0);
    const manuel = d.soldeHier!==null && d.soldeHier!==undefined && d.soldeHier!=="";
    if(manuel || prevTot!==null){
      const hier = manuel ? n(d.soldeHier) : prevTot, dep=(d.depenses||[]).reduce((a,r)=>a+n(r.montant),0);
      R[k] = Math.max(0, -(tot-hier+dep));
    }
    prevTot = tot;
  }
  return R;
}
// Habitudes des fuites dans le temps : jour de la semaine, moment de la journée
function rythmeFuites(){
  const FT = fuitesToutes(), pages = Object.keys(FT);
  const parJour={}, fuJour={}, parMom={}, fuMom={}; let nb=0, tot=0;
  const mom = k => { const h=hourOf(k); if(!h) return null; const hh=+h.slice(0,2); return hh<12?"le matin":hh<17?"l'après-midi":"le soir"; };
  for(const k of pages){
    const [y,m,dd]=dayOf(k).split("-").map(Number), j=new Date(y,m-1,dd).toLocaleDateString("fr-FR",{weekday:"long"}), mo=mom(k), f=FT[k];
    parJour[j]=(parJour[j]||0)+1; if(mo) parMom[mo]=(parMom[mo]||0)+1;
    if(f>0){ nb++; tot+=f; fuJour[j]=(fuJour[j]||0)+1; if(mo) fuMom[mo]=(fuMom[mo]||0)+1; }
  }
  const notes=[];
  for(const j in fuJour) if(fuJour[j]>=2 && fuJour[j]/parJour[j]>=.5) notes.push("Les fuites reviennent souvent le "+j+" ("+fuJour[j]+" fois sur "+parJour[j]+").");
  for(const mo in fuMom) if(fuMom[mo]>=2 && fuMom[mo]/parMom[mo]>=.5) notes.push("Les fuites arrivent surtout "+mo+" ("+fuMom[mo]+" pages sur "+parMom[mo]+"). Qui tient la caisse à ce moment-là ?");
  return {nb, tot, notes};
}
const NIV = s => s>=.7 ? ["Probable","p1"] : s>=.35 ? ["Possible","p2"] : ["À vérifier","p3"];
function blocPistes(k){
  const r=enquete(k);
  const liste = r.pistes.map(p=>{ const [lb,cl]=NIV(p.score); return `<li class="${p.sorte==="explication"?"expl":""}"><span class="niv ${p.sorte==="explication"?"p3":cl}">${p.sorte==="explication"?"Explication":lb}</span><b>${esc(p.titre)}</b><span>${esc(p.texte)}</span></li>`; }).join("");
  const al = r.alertes.map(a=>`<li><span class="niv p2">Inhabituel</span><b>${esc(a.titre)}</b><span>${esc(a.texte)}</span></li>`).join("");
  const ry = r.F>0 ? rythmeFuites().notes.map(t=>`<li><span class="niv p2">Habitude</span><span>${esc(t)}</span></li>`).join("") : "";
  if(r.F>0){
    return `<section class="block pistes"><div class="block-head"><h2>Où chercher la fuite</h2><span class="num neg">${fc(r.F)}</span></div>
      <div class="hint">L'application compare chaque ligne avec la page précédente et avec vos habitudes. Ce sont des pistes, pas des preuves : vérifiez avant d'accuser quelqu'un.</div>
      <ul class="pst">${liste || `<li><span class="niv p3">À vérifier</span><span>Aucune ligne ne sort de l'habitude. Recomptez les espèces, et cherchez une dépense ou une dette non notée.</span></li>`}${al}${ry}</ul></section>`;
  }
  if(al) return `<section class="block pistes"><div class="block-head"><h2>À surveiller</h2></div><ul class="pst">${al}</ul></section>`;
  return "";
}
// Carnet des fuites pour l'Historique
function carnetFuites(){
  const FT = fuitesToutes(), pages = Object.keys(FT).filter(k=>FT[k]>0).sort().reverse();
  if(!pages.length) return "";
  const ry = rythmeFuites();
  return `<section class="block pistes"><div class="block-head"><h2>Carnet des fuites</h2><span class="num neg">${fc(ry.tot)}</span></div>
    <div class="hint">${ry.nb} page${ry.nb>1?"s":""} avec fuite. Pour chacune, la piste la plus probable.</div>
    <ul class="pst">${ry.notes.map(t=>`<li><span class="niv p2">Habitude</span><span>${esc(t)}</span></li>`).join("")}
    ${pages.slice(0,12).map(k=>{ const r=enquete(k), p=r.pistes.find(x=>x.sorte!=="explication")||r.pistes[0];
      return `<li><button class="carnet" data-open="${k}"><b>${esc(shortDate(k))} · ${fc(r.F)}</b><span>${p?esc(p.titre):"Aucune piste claire"}</span></button></li>`; }).join("")}</ul></section>`;
}

function courbeGain(jusqua, nb){
  const all = sortedDates().filter(d=> (!jusqua || d<=jusqua) && !estVide(days[d])).slice(-nb);
  if(all.length<2) return `<div class="hint" style="padding:0 0 4px">La courbe apparaîtra dès qu'il y aura au moins deux journées.</div>`;
  const pts = all.map(dt=>{ const c=calc(days[dt]); return {dt, g:c.gain, f:fuiteDe(c)}; });
  const W=Math.max(320, pts.length*34), H=150, padY=14, padX=10;
  const vals = pts.map(p=>p.g), mx=Math.max(0,...vals), mn=Math.min(0,...vals), rg=(mx-mn)||1;
  const X=i=> padX + i*(W-2*padX)/(pts.length-1);
  const Y=v=> padY + (mx-v)*(H-2*padY)/rg;
  const line = pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.g).toFixed(1)).join(" ");
  const area = line + ` L${X(pts.length-1).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const dots = pts.map((p,i)=>{
    const col = p.f>0 ? "var(--loss)" : (p.g<0 ? "var(--copper)" : "var(--mala)");
    const r = p.f>0 ? 6 : 4;
    const tip = shortDate(p.dt)+" : "+(p.g>0?"+":"")+fc(p.g)+(p.f>0?" — fuite "+fc(p.f):"");
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.g).toFixed(1)}" r="${r}" fill="${col}" stroke="var(--surface)" stroke-width="2"><title>${esc(tip)}</title></circle>`;
  }).join("");
  const nbF = pts.filter(p=>p.f>0).length;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Courbe du gain des dernières journées">
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <path d="${area}" fill="var(--mala)" opacity=".10"/>
    <path d="${line}" fill="none" stroke="var(--mala)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}</svg>
    <div class="lg"><span><i style="background:var(--mala)"></i>Gain</span><span><i style="background:var(--copper)"></i>Baisse expliquée par les dépenses</span><span><i style="background:var(--loss)"></i>Fuite d'argent</span></div>
    ${nbF?`<div class="hint" style="padding:6px 0 0">${nbF} journée${nbF>1?"s":""} avec fuite sur cette courbe. Touchez un point pour voir le détail.</div>`:""}`;
}

function renderHist(){
  const all = sortedDates().slice().reverse();

  const last = rows.slice(0,30).reverse();
  const max = Math.max(1, ...last.map(r=>Math.abs(r.c.gain)));
  const w = Math.max(300, last.length*22), h=120, mid=h/2, bw=14;
  const bars = last.map((r,i)=>{ const bh = Math.abs(r.c.gain)/max*(mid-6); const x=i*22+4; const y = r.c.gain>=0 ? mid-bh : mid;

// ---------- Nouvelle page (plusieurs pages possibles dans une journée) ----------
// La nouvelle page reprend les lignes, les prix et le taux, mais pas les chiffres : elle s'ouvre vide.
function pageVideDepuis(key, src){
  const s2 = JSON.parse(JSON.stringify(src)), sc = chg(s2);
  return { date:key, taux:s2.taux,
    mm: s2.mm.map(r=>({label:r.label, fc:0, usd:0})),
    un: s2.un.map(r=>({label:r.label, qte:0, prix:r.prix})),
    esp:{fc:0, usd:0, commission:0},
    dettes:s2.dettes||[], creanciers:s2.creanciers||[], depenses:[], soldeHier:null,
    change:{tauxAchat:sc.tauxAchat, objectif:sc.objectif, achats:[], ventes:[]} };
}
function creerPage(key){
  if(days[key]){ cur=key; tab="jour"; render(); window.scrollTo(0,0); return; }
  const all = sortedDates();
  const p = prevDate(key) || (all.length? all[all.length-1] : null);
  days[key] = p ? pageVideDepuis(key, days[p]) : blankDay(key);
  cur=key; tab="jour"; render(); window.scrollTo(0,0); scheduleSave(key);
}
function nouvellePageMaintenant(){
  const x=new Date();
  creerPage(today()+"T"+String(x.getHours()).padStart(2,"0")+"h"+String(x.getMinutes()).padStart(2,"0"));
}
function openNewDay(){
  const all = sortedDates();
  const x = new Date(), hh = String(x.getHours()).padStart(2,"0"), mi = String(x.getMinutes()).padStart(2,"0");
  const nbAuj = pagesOf(today()).length;
  const bg = document.createElement("div");
  bg.className="sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nd-t">
    <h3 id="nd-t">Nouvelle page</h3>
    <p>${all.length ? "La page s'ouvre vide, avec vos lignes, vos prix et le taux : tapez les chiffres de ce moment. Vous pouvez faire plusieurs pages dans la même journée, à des heures différentes." : "Une grille vide sera créée avec vos services et réseaux."}${nbAuj ? " Déjà "+nbAuj+" page"+(nbAuj>1?"s":"")+" aujourd'hui." : ""}</p>
    <div class="row mm" style="padding:0; border:none">
      <label class="f">Date<input class="t" type="date" id="nd-date" value="${today()}"></label>
      <label class="f">Heure<input class="t" type="time" id="nd-heure" value="${hh}:${mi}"></label>
    </div>
    <div class="btns"><button class="ghost" id="nd-no">Annuler</button><button class="primary" id="nd-ok">Créer</button></div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.querySelector("#nd-no").onclick=close;
  bg.querySelector("#nd-ok").onclick=()=>{
    const date = bg.querySelector("#nd-date").value; if(!date) return;
    const h = (bg.querySelector("#nd-heure").value || "00:00").split(":");
    const key = date + "T" + h[0].padStart(2,"0") + "h" + (h[1]||"00").padStart(2,"0");
    close();
    creerPage(key);
  };
}

function setPath(obj, path, val){ const k=path.split("."); let o=obj; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=val; }
function majDevine(){
  const mo=document.getElementById("dep-motif"), z=document.getElementById("dep-devine"), s=document.getElementById("dep-cat");
  if(!mo||!z) return;
  z.textContent = (mo.value.trim() && s && !s.value) ? "→ "+catNom(devineCat(mo.value)) : "";
}
main.addEventListener("change", e=>{
  const el=e.target; if(el.tagName!=="SELECT") return;
  if(el.id==="dep-cat") return majDevine();
  const p=el.dataset.p; if(!p||!cur) return;
  setPath(days[cur], p, el.value); scheduleSave(cur);
});
main.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="dep-motif"){ majDevine(); return; }
  if(el.tagName==="SELECT") return;
  const p=el.dataset.p; if(!p||!cur) return;
  let v = el.value;
  if(el.classList.contains("n")){ v = v.trim()==="" ? (p==="soldeHier"? null : 0) : n(v); }
  setPath(days[cur], p, v);
  update(); scheduleSave(cur);
});
// Confirmation dans la page (les fenêtres du navigateur sont bloquées ici)
function ask(msg, ok){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="sheet-bg";
    bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(msg)}</h3><div class="btns"><button class="ghost" data-a="no">Annuler</button><button class="primary" data-a="ok" style="background:var(--loss)">${esc(ok||"Retirer")}</button></div></div>`;
    document.body.appendChild(bg);
    const done=v=>{ bg.remove(); res(v); };
    bg.addEventListener("click",e=>{ if(e.target===bg) return done(false); const b=e.target.closest("button"); if(b) done(b.dataset.a==="ok"); });
  });
}
main.addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.act==="depadd"){
    const mo=document.getElementById("dep-motif"), mt=document.getElementById("dep-montant"), sc=document.getElementById("dep-cat");
    const v=n(mt.value); if(!v && !mo.value.trim()){ mo.focus(); return; }
    const dep={motif:mo.value.trim()||"Dépense", montant:v};
    if(sc && sc.value) dep.cat=sc.value;
    days[cur].depenses.push(dep);
    depOuvert=false; render(); scheduleSave(cur);
    const m2=document.getElementById("dep-motif"); if(m2){ m2.scrollIntoView({block:"center"}); }
    return;
  }
  if(b.dataset.dper){ depPer=b.dataset.dper; const y=window.scrollY; renderHist(); window.scrollTo(0,y); return; }
  if(b.dataset.act==="newpage") return nouvellePageMaintenant();
  if(b.dataset.act==="newday") return openNewDay();
  if(b.dataset.act==="copymail"){
    const t="micheltshiepela331@gmail.com";
    try{ await navigator.clipboard.writeText(t); b.textContent="Copié"; }
    catch(err){ const r=document.createRange(); r.selectNodeContents(document.getElementById("mail")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent="Sélectionné"; }
    setTimeout(()=>{ b.textContent="Copier"; }, 2000); return;
  }
  if(b.dataset.act==="deleteday"){
    if(!(await ask("Supprimer la page du "+longDate(cur)+" ?","Supprimer"))) return;
    const d=cur; delete days[d]; persist(d);
    const all=sortedDates(); cur = all.length? all[all.length-1] : null; tab="jour"; render(); return;
  }
  if(b.dataset.cadd){
    const c = chg(days[cur]);

async function hacher(code, sel){
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(sel+":"+code)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for(const ch of sel+":"+code) h=(h*31+ch.charCodeAt(0))|0; return "s"+h; }
}
const PIN_ESSAIS="shopRedemption.pinEssais";
function pinAttente(){ try{ const e=JSON.parse(localStorage.getItem(PIN_ESSAIS)||'{"n":0,"t":0}'); return Math.max(0, Math.ceil((e.t-Date.now())/1000)); }catch(x){ return 0; } }
async function pinVerifie(code){
  const d=pinData(); if(!d || pinAttente()>0) return false;
  const ok=(await hacher(code, d.sel))===d.h;
  let e={n:0,t:0}; try{ e=JSON.parse(localStorage.getItem(PIN_ESSAIS)||'{"n":0,"t":0}'); }catch(x){}
  if(ok) e={n:0,t:0}; else { e.n++; if(e.n>=5) e.t=Date.now()+30000*Math.pow(2,e.n-5); }
  try{ localStorage.setItem(PIN_ESSAIS, JSON.stringify(e)); }catch(x){}
  return ok;
}

// écran avec un pavé de 4 chiffres ; renvoie le code tapé (ou null si annulé)
function pave(titre, sousTitre, annulable, verifier){
  return new Promise(res=>{
    const el=document.createElement("div"); el.className="lock"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
    el.innerHTML=`<h2>${esc(titre)}</h2><p>${esc(sousTitre)}</p><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="msg" aria-live="polite"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-k="${k}">${k}</button>`).join("")}<button class="${annulable?"":"vide"}" data-k="x" aria-label="Annuler" style="font-size:1rem">${annulable?"Annuler":""}</button><button data-k="0">0</button><button data-k="b" aria-label="Effacer">⌫</button></div>`;
    document.body.appendChild(el);
    let code="";
    const dots=el.querySelector(".dots"), msg=el.querySelector(".msg");
    const maj=()=>dots.querySelectorAll("i").forEach((d,i)=>d.classList.toggle("on", i<code.length));
    const touche=async k=>{
      if(k==="x"){ if(annulable){ el.remove(); res(null); } return; }
      if(k==="b"){ code=code.slice(0,-1); maj(); return; }
      if(code.length>=4) return;
      code+=k; maj(); msg.textContent="";
      if(code.length===4){
        if(verifier && !(await verifier(code))){ dots.classList.remove("err"); void dots.offsetWidth; dots.classList.add("err"); const att=(verifier===pinVerifie)?pinAttente():0; msg.textContent= att>0 ? "Trop de codes faux. Attendez "+att+" secondes." : "Code incorrect"; code=""; setTimeout(maj,250); return; }
        el.remove(); res(code);
      }
    };
    el.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) touche(b.dataset.k); });
    el._key = e=>{ if(!document.body.contains(el)) return removeEventListener("keydown", el._key); if(/^[0-9]$/.test(e.key)) touche(e.key); else if(e.key==="Backspace") touche("b"); else if(e.key==="Escape") touche("x"); };
    addEventListener("keydown", el._key);
  });
}

// ---------- Notes : un brouillon libre pour noter ses dépenses et faire ses calculs ----------
const NOTES_TXT="shopRedemption.notesTexte";
let notesTxt = (()=>{ try{ const t=localStorage.getItem(NOTES_TXT); if(t!=null) return t;
  const old=JSON.parse(localStorage.getItem("shopRedemption.notes")||"[]"); return Array.isArray(old) ? old.map(r=>(r.motif||"")+" "+(n(r.montant)||"")).join("\n") : ""; }catch(e){ return ""; } })();
// le dernier nombre de chaque ligne est additionné : « transport 3000 », « repas 2 500 »
function montantLigne(l){
  const m=String(l).match(/\d[\d .,]*/g); if(!m) return null;
  let x=m[m.length-1].trim().replace(/\s/g,"");
  if(/^\d{1,3}(\.\d{3})+$/.test(x)) x=x.replace(/\./g,"");
  x=x.replace(",",".");
  const v=parseFloat(x); return isFinite(v)?v:null;
}
function totalNotes(){ let t=0, k=0; notesTxt.split("\n").forEach(l=>{ const v=montantLigne(l); if(v!=null){ t+=v; k++; } }); return {t,k}; }
function renderNotes(){
  const lignes = notesTxt.length ? notesTxt.split("\n") : [""];
  main.innerHTML = `
  <section class="block notes-page">
    <div class="block-head"><h2>Notes</h2><span class="num" id="nt-total"></span></div>
    <div class="hint">Votre brouillon : une dépense par ligne, par exemple « transport 3000 ». Touchez « Entrée » pour passer à la ligne suivante. Le total s'additionne tout seul.</div>
    <ol class="nt-list" id="nt-list">${lignes.map((l,i)=>ligneNote(l,i)).join("")}</ol>
    <button class="add" data-act="ntadd">+ Nouvelle ligne</button>
    <div class="nt-foot" style="padding-right:84px"><button class="ghost danger" data-act="notesclear">Effacer</button><span class="hint" id="nt-info" style="padding:0; text-align:right"></span></div>
  </section>`;
  majTotalNotes();
}
function majTotalNotes(){ const r=totalNotes(), e=document.getElementById("nt-total"), i=document.getElementById("nt-info");
  if(e) e.textContent=fc(r.t); if(i) i.textContent = r.k ? r.k+" montant"+(r.k>1?"s":"")+" additionné"+(r.k>1?"s":"")+" · "+usd(r.t/(n(days[cur]&&days[cur].taux)||DEF_TAUX)) : "Aucun montant pour l'instant."; }
function ligneNote(l,i){ const v=montantLigne(l);
  return `<li class="nt-row"><span class="no">${i+1}</span><input class="nt-l" value="${esc(l)}" enterkeyhint="next" aria-label="Ligne ${i+1}" autocomplete="off"><span class="amt">${v!=null?fmt(v):""}</span></li>`; }
function lireNotes(){ const ins=[...document.querySelectorAll("#nt-list .nt-l")]; notesTxt = ins.map(x=>x.value).join("\n").replace(/\n+$/,""); try{ localStorage.setItem(NOTES_TXT, notesTxt); }catch(e){} }
function renumeroter(){ document.querySelectorAll("#nt-list .nt-row").forEach((li,i)=>{ li.querySelector(".no").textContent=i+1; li.querySelector(".nt-l").setAttribute("aria-label","Ligne "+(i+1)); }); }
function nouvelleLigne(apres, texte){
  const tmp=document.createElement("ol"); tmp.innerHTML=ligneNote(texte||"",0); const li=tmp.firstElementChild;
  const list=document.getElementById("nt-list");
  if(apres && apres.nextSibling) list.insertBefore(li, apres.nextSibling); else list.appendChild(li);
  renumeroter(); const inp=li.querySelector(".nt-l"); inp.focus(); inp.setSelectionRange(0,0); inp.scrollIntoView({block:"nearest"}); return li;
}
function majLigne(el){ const v=montantLigne(el.value); el.closest(".nt-row").querySelector(".amt").textContent = v!=null?fmt(v):""; }
main.addEventListener("keydown", e=>{
  const el=e.target; if(!el.classList || !el.classList.contains("nt-l")) return;
  const li=el.closest(".nt-row");
  if(e.key==="Enter"){ e.preventDefault(); const pos=(el.selectionStart==null ? el.value.length : el.selectionStart), reste=el.value.slice(pos); el.value=el.value.slice(0,pos); majLigne(el); nouvelleLigne(li, reste); lireNotes(); majTotalNotes(); }
  else if(e.key==="Backspace" && el.selectionStart===0 && el.selectionEnd===0 && li.previousElementSibling){
    e.preventDefault(); const prev=li.previousElementSibling.querySelector(".nt-l"), lg=prev.value.length; prev.value+=el.value; li.remove(); renumeroter(); majLigne(prev); prev.focus(); prev.setSelectionRange(lg,lg); lireNotes(); majTotalNotes(); }
});
main.addEventListener("input", e=>{ if(!e.target.classList || !e.target.classList.contains("nt-l")) return; majLigne(e.target); lireNotes(); majTotalNotes(); });
main.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b || b.dataset.act!=="ntadd") return; const last=document.querySelector("#nt-list .nt-row:last-child"); if(last && !last.querySelector(".nt-l").value.trim()){ last.querySelector(".nt-l").focus(); return; } nouvelleLigne(last, ""); });
main.addEventListener("click", async e=>{ const b=e.target.closest("button"); if(!b || b.dataset.act!=="notesclear") return;

<script>
// Calculatrice du shop : calculs rapides, conversion au taux du jour, et résultat placé dans la case choisie.
(function(){
  const bg=document.getElementById("calc-bg"), exprEl=document.getElementById("calc-expr"), resEl=document.getElementById("calc-res");
  const usdEl=document.getElementById("calc-usd"), fcEl=document.getElementById("calc-fc"), putBtn=document.getElementById("calc-put");
  let expr="", lastField=null, justDone=false;
  const OPS="+-*/";
  const show = v => { if(!isFinite(v)) return "Erreur"; const r=Math.round(v*100)/100; return r.toLocaleString("fr-FR",{maximumFractionDigits:2}).replace(/\u202f|\u00a0/g," "); };
  const pretty = e => e.replace(/\*/g," × ").replace(/\//g," ÷ ").replace(/\+/g," + ").replace(/(\d)-/g,"$1 − ").replace(/\./g,",");
  function evaluate(e){
    // découpe en nombres et opérateurs, puis × et ÷ avant + et −
    const t=[]; let num="";
    for(let i=0;i<e.length;i++){ const ch=e[i];
      if("0123456789.".includes(ch) || (ch==="-" && (i===0 || OPS.includes(e[i-1])))) num+=ch;
      else if(ch==="%"){ if(num!==""){ num=String(parseFloat(num)/100); } }
      else if(OPS.includes(ch)){ if(num===""||num==="-") return NaN; t.push(parseFloat(num), ch); num=""; } }
    if(num===""||num==="-") { if(t.length) t.pop(); else return 0; } else t.push(parseFloat(num));
    const a=[t[0]];
    for(let i=1;i<t.length;i+=2){ const op=t[i], v=t[i+1];
      if(op==="*") a[a.length-1]*=v; else if(op==="/") a[a.length-1]/=v; else a.push(op, v); }
    let r=a[0]; for(let i=1;i<a.length;i+=2) r = a[i]==="+" ? r+a[i+1] : r-a[i+1];
    return r;
  }
  const taux = () => { try{ const d=document.querySelector('[data-p="taux"]'); const v=d&&parseFloat(String(d.value||d.placeholder).replace(/\s/g,"").replace(",",".")); return v>0?v:2300; }catch(e){ return 2300; } };
  function refresh(){
    const v=evaluate(expr);
    exprEl.textContent = pretty(expr);
    resEl.textContent = expr ? show(v) : "0";
    const t=taux();
    if(expr && isFinite(v) && v!==0){ usdEl.textContent = "= "+show(v/t)+" $"; fcEl.textContent = "= "+show(v*t)+" FC si ce sont des $"; }
    else { usdEl.textContent=""; fcEl.textContent=""; }
    putBtn.hidden = !(lastField && document.body.contains(lastField));
  }
  function press(k){
    if(k==="C"){ expr=""; }
    else if(k==="back"){ expr=expr.slice(0,-1); }
    else if(k==="="){ const v=evaluate(expr); expr = isFinite(v) ? String(Math.round(v*100)/100) : ""; justDone=true; refresh(); return; }
    else if(OPS.includes(k)){ if(!expr && k!=="-") return; if(OPS.includes(expr.slice(-1))) expr=expr.slice(0,-1); expr+=k; }
    else if(k==="%"){ if(expr && !OPS.includes(expr.slice(-1)) && expr.slice(-1)!=="%") expr+="%"; }
    else if(k==="."){ const part=expr.split(/[-+*/]/).pop(); if(justDone){ expr="0"; } if(!part.includes(".")) expr += (part===""?"0.":"."); }
    else { if(justDone) expr=""; if(expr.slice(-1)==="%") expr+="*"; expr+=k; }
    justDone=false; refresh();
  }
  document.getElementById("calc-keys").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) press(b.dataset.k); });
  bg.querySelector(".extra").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return; const v=evaluate(expr), t=taux(); if(!isFinite(v)) return;
    if(b.dataset.x==="tousd"){ expr=String(Math.round(v/t*100)/100); justDone=true; refresh(); }
    else if(b.dataset.x==="tofc"){ expr=String(Math.round(v*t*100)/100); justDone=true; refresh(); }
    else if(b.dataset.x==="put" && lastField){ lastField.value = String(Math.round(v*100)/100); lastField.dispatchEvent(new Event("input",{bubbles:true})); close(); }
  });
  // retient la dernière case de chiffres touchée, pour y placer le résultat
  document.getElementById("main").addEventListener("focusin", e=>{ if(e.target.matches("input.n")) lastField=e.target; });
  function open(){ bg.hidden=false; refresh(); }
  function close(){ bg.hidden=true; }
  document.getElementById("calc-open").onclick=open;
  document.getElementById("calc-close").onclick=close;
  bg.addEventListener("click", e=>{ if(e.target===bg) close(); });
  addEventListener("keydown", e=>{ if(bg.hidden) return; const k=e.key;
    if(/^[0-9]$/.test(k)||OPS.includes(k)) press(k); else if(k===","||k===".") press(".");
    else if(k==="Enter"||k==="=") { e.preventDefault(); press("="); } else if(k==="Backspace") press("back"); else if(k==="Escape") close(); else if(k==="%") press("%"); });
})();
</script>
